  "@types/node": ^24
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  happy-dom: ^20.14.6
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: ^6.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
overrides:
